<!doctype html><html lang="hi"><head><meta charset="utf-8"><title>Paper Scanner</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Paper Scanner"><meta name="theme-color" content="#101214">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="icon" href="icons/icon-192.png">
<style>
:root{--bg:#101214;--c:#1b1e22;--c2:#262a30;--l:#32373e;--t:#f1f2f3;--m:#9aa2ac;--g:#45c486;--r:#f0705f;--y:#e8b84f;--a:#6ab0ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--t);font:15px/1.45 -apple-system,BlinkMacSystemFont,sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;border-bottom:1px solid var(--l)}h1{font-size:18px;margin:0}#upd{color:var(--m);font-size:12px}
main{padding:12px 16px calc(env(safe-area-inset-bottom) + 84px);max-width:640px;margin:auto}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--c);border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom);z-index:3}nav button{background:none;border:0;color:var(--m);padding:13px 2px;font:600 13px -apple-system,sans-serif}nav button.on{color:var(--a)}
.card{background:var(--c);border-radius:12px;padding:13px;margin-bottom:10px}.card h3{margin:0 0 5px;font-size:16px}.mut{color:var(--m);font-size:13px}.warn{border:1px solid var(--y);background:#2a2415}.bad{border:1px solid var(--r);background:#2c1a18}.big{font-size:21px;font-weight:700}.g{color:var(--g)}.r{color:var(--r)}.y{color:var(--y)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;margin:6px 0}.kv span:nth-child(even){text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
button.act{width:100%;min-height:44px;border-radius:10px;border:0;background:var(--a);color:#06121f;font:600 15px -apple-system,sans-serif;margin-top:8px}button.sec{background:var(--c2);color:var(--t)}button:disabled{opacity:.5}.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:9px;background:var(--c2);color:var(--m)}h2{font-size:15px;margin:16px 0 8px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}svg{width:100%;height:auto;display:block}ul{margin:4px 0;padding-left:20px}li{margin:3px 0}input[type=file]{display:none}
</style></head><body>
<header><h1>Paper Scanner <span class="tag">Nakli paisa</span></h1><div id="upd">Data load ho raha hai…</div></header>
<main id="m"></main>
<nav><button data-t="today" class="on">Aaj</button><button data-t="trades">Trades</button><button data-t="results">Results</button><button data-t="learn">Seekho</button></nav>
<script src="strategy.js"></script><script src="app.js"></script></body></html>
